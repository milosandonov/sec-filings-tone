[project]
name = "sec-filings-tone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "milosandonov", email = "milosandonov7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.13.0",
    "bm25s>=0.3.13",
    "chromadb>=1.5.9",
    "edgartools>=5.61.1",
    "google-genai>=2.29.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "openai>=3.29.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
sec-filings-tone = "sec_filings_tone:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
