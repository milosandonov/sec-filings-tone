[project]
name = "sec-filings-tone"
version = "1.0.0"
description = "Topic tone profiles of S&P 500 10-K filings: hybrid retrieval, LLM scoring, FinBERT and Loughran-McDonald baselines, event tests"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Miloš Andonov", email = "milosandonov7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.13.0",
    "bm25s>=0.3.13",
    "chromadb>=1.5.9",
    "edgartools>=5.61.1",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.29.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
# FinBERT baselines (sentiment.py, tone.py): uv sync --extra finbert
finbert = ["torch>=2.14.1", "transformers>=5.19.0"]
# the Q&A chat app (app.py): uv sync --extra app
app = ["gradio>=6.30.0"]
# eval/experiment.py's open embedding models (bge-m3, Qwen3): uv sync --extra experiment
experiment = ["sentence-transformers>=6.1.0"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
